[project]
name = "gravel-ride-plan"
version = "0.1.0"
description = "Claude Code skills that plan a gravel ride near Amsterdam: timing, events, route, gear, briefing."
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Nuno Ferreira" }]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
